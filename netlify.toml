# netlify.toml
# Build config + scheduled functions for Pulse

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Scheduled functions.
#
# Netlify only honours the per function table with a schedule key, the form
# below. This file carried made up [[scheduled_functions]] tables until
# 2026-09-12 and Netlify ignored them without complaint, the same trap the
# studio site found on 2026-08-23. The effect here: flip-overdue-invoices had
# no schedule at all and never fired, and keep-alive ran on the inline
# schedule in its own file, which said every five days. Every function that
# needs a schedule now has it here AND in an inline `export const config`
# in its file, and the two must agree. Change both or neither.
#
# keep-alive             every five days at 08:00 UTC, one read against the
#                        shared Supabase project so the free tier's seven day
#                        pause never lands. Five days, not five minutes, the
#                        old table said minutes and was wrong.
# flip-overdue-invoices  daily at 06:00 UTC, midnight Mountain, flips due
#                        invoices to overdue
# draft-repeat-invoices  daily at 12:00 UTC, drafts the period invoice for push
#                        rail subscriptions, unsent
# release-social         moved to the STUDIO site on 2026-09-12 because the
#                        bot tokens were set there and a token lives in
#                        exactly one place. The Releases page here is the
#                        desk, neonburro/netlify/functions/release-social.js
#                        is the hand. Do not schedule a copy here again.
# release-meta           every five minutes, the Meta posting hand for
#                        facebook and instagram, added 2026-09-25. It lives
#                        here and not on the studio for the same reason in
#                        reverse, the plan sets the Meta values on the Pulse
#                        site, META_PAGE_ACCESS_TOKEN, META_PAGE_ID and
#                        META_IG_USER_ID, functions scope. Telegram stays on
#                        the studio. Dark until the env exists, a staged and
#                        approved row fails with the missing names spelled
#                        out and the account rows stay off until an admin
#                        flips them.

[functions."keep-alive"]
  schedule = "0 8 */5 * *"

[functions."flip-overdue-invoices"]
  schedule = "0 6 * * *"

# draft-repeat-invoices  daily at 12:00 UTC, six in the morning in Ridgway.
#                        Drafts the invoice for every active push rail
#                        subscription whose next_invoice_at has arrived. Sends
#                        nothing, the draft sits in Invoicing for a person.
[functions."draft-repeat-invoices"]
  schedule = "0 12 * * *"

[functions."release-meta"]
  schedule = "*/5 * * * *"

# The studio library, proxied. neonburro.com sends no CORS header on
# /library/index.json so the Socials picture picker cannot fetch it across
# origins. This rewrite serves it from the Pulse origin, status 200 is a
# proxy not a redirect. It sits above the SPA catch-all because the first
# match wins. vite.config.js carries the same proxy for the dev server.
[[redirects]]
  from = "/studio-library/*"
  to = "https://neonburro.com/library/:splat"
  status = 200

# SPA rewrite - all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
