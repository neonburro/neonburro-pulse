<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Title: ϟ is Greek koppa, reads as lightning. Distinctive in any tab strip. -->
    <title>Pulse ϟ</title>

    <!-- Description: used by iMessage/Slack/SMS previews when pasted as a link -->
    <meta name="description" content="Every invoice, every deploy, one place your client can actually see." />

    <!-- Do not index, this is an internal tool -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- Icons. The lime burro on a dark disc, generated by neonburro/scripts/favicons.mjs. ?v busts the favicon cache, bump it when the mark changes. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
    <link rel="manifest" href="/site.webmanifest">

    <!-- PWA / iOS home screen, behaves like a native app when saved -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme color, sets browser chrome on mobile, respects OS theme -->
    <meta name="theme-color" content="#C5D957" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph, for iMessage, Slack, Discord, Signal, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="neonburro" />
    <meta property="og:url" content="https://pulse.neonburro.com/" />
    <meta property="og:title" content="Pulse ϟ the client portal" />
    <meta property="og:description" content="Every invoice, every deploy, one place your client can actually see." />
    <meta property="og:image" content="https://pulse.neonburro.com/og/pulse-dome-boardroom-observer-fish-night-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The neonburro boardroom, a fish watching the valley through the dome" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse ϟ the client portal" />
    <meta name="twitter:description" content="The signal, amplified." />
    <meta name="twitter:image" content="https://pulse.neonburro.com/og/pulse-dome-boardroom-observer-fish-night-card.jpg" />

    <!-- Fonts, Inter (UI), JetBrains Mono (data/labels), Fraunces (editorial numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
